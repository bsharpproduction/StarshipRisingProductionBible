          { x: 960, y: 860, align: 'center', out: 171.35, fade: 0.4, words: [sung('The', 164.44, { role: 'mono', rung: 'whisper', mono: true }), sung('machine', 164.82, { role: 'mono', rung: 'whisper', mono: true }), sung('that', 166.02, { role: 'mono', rung: 'whisper', mono: true }), sung('dreams', 166.72, { role: 'mono', rung: 'whisper', mono: true, splitFor: 2 / FPS }), sung('of', 167.28, { role: 'mono', rung: 'whisper', mono: true }), sung('breathing', 167.78, { role: 'mono', rung: 'whisper', mono: true })] },

          { x: W / 2, y: 560, align: 'center', out: 176.25, fade: 0.35, words: [sung("Don't", 171.7, { rung: 'strain' }), sung('look', 172.38, { rung: 'strain' }), sung('down', 172.94, { rung: 'strain' })] },

          { x: W / 2, y: 640, align: 'center', out: 182.0, fade: 0.7, decay: true, words: [sung('DOWN', 176.46, { wall: true, wallSize: 300, cyan: false })] },
        ]

        LINES.forEach((line) => {
          line.words[line.words.length - 1].last = true
        })

        const INVERTS = [31.62, 34.74, 46.68, 69.3, 124.28, 166.72]

        const sectionAlpha = (section, t) => {
          if (t < section.from || t >= section.to) return 0
          if (section.insert) return 1
          const inn = section.fadeIn ? smooth(section.from, section.from + section.fadeIn, t) : 1
          const out = section.fadeOut ? 1 - smooth(section.to - section.fadeOut, section.to, t) : 1
          return inn * out
        }

        const motionTime = (section, t) => {
          if (REDUCED || !section.step) return t
          if (section.stepUntil && t > section.stepUntil) return t
          return Math.floor(t * 12) / 12
        }

        const staticLevel = (t) => {
          if (t >= 66.15 && t < 70.5) return 0.52
          if (t >= 121.2 && t < 125.3) return 0.5
          if (t >= 184.6) return lerp(0.16, 0.68, smooth(184.6, 200, t))
          if (t >= 60.08 && t < 66.15) return 0.22
          if (t < 24.15) return 0.06
          return 0.1
        }

        const glitchAmount = (t) => {
          const hits = [
            [46.55, 0.45],
            [69.15, 0.5],
            [124.15, 0.42],
            [166.65, 0.12],
          ]
          let amount = 0
          for (const [t0, dur] of hits) {
            const u = (t - t0) / dur
            if (u >= 0 && u < 1) amount = Math.max(amount, 1 - u)
          }
          if (t > 192) amount = Math.max(amount, smooth(192, 206, t) * 0.85)
          return amount
        }

        const fontFor = (role, size) => {
          if (role === 'nerve') return `italic 500 ${size}px ${NERVE}`
          if (role === 'mono') return `400 ${size}px ${MONO}`
          return `500 ${size}px ${BODY}`
        }

        const sizeOf = (word, t) => {
          const scale = word.scale || 1
          if (word.wall) {
            const target = word.wallSize || SIZES.wall
            if (!word.wallDrop) return target
            const u = t - word.t
            const hold = word.wallFor || 8 / FPS
            if (u < hold) return target
            return lerp(target, SIZES.cry, smooth(hold, hold + 0.28, u))
          }
          if (word.scalehit) {
            const u = t - word.t
            const from = SIZES[word.rung] * scale
            const cry = SIZES.cry * scale
            const strain = SIZES.strain * scale
            if (u < 0) return from
            if (u < 0.1) return lerp(from, cry, easeOut(u / 0.1))
            if (u < 0.55) return lerp(cry, strain, smooth(0.1, 0.55, u))
            return strain
          }
          if (word.strainFor) {
            const u = t - word.t
            const rung = u >= 0 && u < word.strainFor ? 'strain' : word.then || 'speak'
            return SIZES[rung] * scale
          }
          return SIZES[word.rung] * scale
        }

        const trackPx = (word, size) => {
          const rung = word.wall ? 'wall' : word.rung
          return (TRACK[rung] ?? 0) * size
        }

        const shownText = (word, t) => {
          if (!word.mono) return word.text
          const count = Math.floor((t - word.t) / 0.02)
          if (count <= 0) return ''
          return word.text.slice(0, count)
        }

        const wordAlpha = (word, line, t) => {
          if (t < word.t) return 0
          let alpha = word.mono ? 1 : line.step ? (t - word.t > 1 / 12 ? 1 : 0) : smooth(word.t, word.t + 0.16, t)
          if (word.fadeFirst) alpha *= 1 - smooth(word.t + 0.25, word.t + 0.8, t)
          const tail = line.hold && word.last ? 0.28 : 0
          const fade = line.fade ?? 0.34
          alpha *= 1 - smooth(line.out + tail - fade, line.out + tail, t)
          if (line.rain) alpha *= 0.8 + 0.2 * hash(Math.floor(t * FPS) + word.t * 17)
          return alpha
        }

        const drawPlate = (img, section, t, alpha, weave) => {
          if (!img || alpha < 0.004) return null
          const mt = motionTime(section, t)
          const p = inv(section.from, section.to, mt)
          let scale = lerp(section.kb.s0, section.kb.s1, p)
          if (section.breathe && !REDUCED) scale *= 1 + 0.02 * Math.sin(t * (BPM / 60) * Math.PI * 2)
          const fx = lerp(section.kb.fx, section.kb.fx1 ?? section.kb.fx, p)
          const fy = lerp(section.kb.fy, section.kb.fy1 ?? section.kb.fy, p)
          const cover = Math.max(W / img.width, H / img.height) * scale
          const iw = img.width * cover
          const ih = img.height * cover
          let dx = W / 2 - fx * iw
          let dy = H / 2 - fy * ih
          if (section.fall) dy += section.fall * H * p
          if (section.shake && !REDUCED) {
            const decay = 1 - smooth(section.from, section.from + 4.2, t)
            const step = Math.floor(t * 12)
            dx += (hash(step) - 0.5) * 7 * decay
            dy += (hash(step + 4) - 0.5) * 5 * decay
          }
          dx = Math.min(0, Math.max(W - iw, dx)) + weave.x
          dy = Math.min(0, Math.max(H - ih, dy)) + weave.y
          ctx.save()
          ctx.globalAlpha = alpha
          if (section.blur && !REDUCED) ctx.filter = `blur(${section.blur}px)`
          ctx.drawImage(img, dx, dy, iw, ih)
          if ((section.smear || section.step) && !REDUCED) {
            ctx.globalAlpha = alpha * 0.28
            ctx.drawImage(img, dx + 14, dy, iw, ih)
          }
          ctx.restore()
          return { dx, dy, s: cover, img, key: section.plate, alpha }
        }

        const drawFlare = (map) => {
          const list = FLARES[map.key]
          if (!list) return
          ctx.save()
          ctx.globalCompositeOperation = 'screen'
          for (const flare of list) {
            const x = map.dx + flare.u * map.img.width * map.s
            const y = map.dy + flare.v * map.img.height * map.s
            const len = flare.len
            const gradient = ctx.createLinearGradient(x - len, y, x + len, y)
            const color = flare.color || SODIUM
            gradient.addColorStop(0, 'rgba(0,0,0,0)')
            gradient.addColorStop(0.42, color)
            gradient.addColorStop(0.5, '#F3E6D0')
            gradient.addColorStop(0.58, color)
            gradient.addColorStop(1, 'rgba(0,0,0,0)')
            ctx.globalAlpha = flare.a * map.alpha
            ctx.fillStyle = gradient
            ctx.fillRect(x - len, y - 3, len * 2, 6)
          }
          ctx.restore()
        }

        const drawClock = (map, t) => {
          if (!map || t < 97.1 || t > 104.2) return
          const x = map.dx + 0.3 * map.img.width * map.s
          const y = map.dy + 0.36 * map.img.height * map.s
          const tForget = 98.18
          const rate = 0.85
          const spinning = Math.min(t, tForget) - 94.7
          const settled = t > tForget ? 0.4 * (1 - Math.exp(-(t - tForget) * 2.4)) : 0
          const angle = spinning * rate + settled - Math.PI / 2
          ctx.save()
          ctx.translate(x, y)
          ctx.rotate(angle)
          ctx.strokeStyle = AMBER
          ctx.globalAlpha = 0.85 * map.alpha
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.moveTo(0, 0)
          ctx.lineTo(34, 0)
          ctx.stroke()
          ctx.restore()
        }

        const drawTear = (t) => {
          const amount = glitchAmount(t)
          if (amount < 0.08 || REDUCED) return
          const frame = Math.floor(t * FPS)
          const bands = 3 + Math.floor(amount * 4)
          for (let i = 0; i < bands; i++) {
            const y = Math.floor(hash(frame * 3 + i * 19) * (H - 20))
            const h = 3 + Math.floor(hash(i + 5) * 14 * amount)
            const shift = Math.round((hash(frame + i * 13) - 0.5) * 64 * amount)
            try {
              const strip = ctx.getImageData(0, y, W, h)
              ctx.putImageData(strip, shift, y)
            } catch (error) {
              warn('Tear skipped (canvas tainted).', error)
              return
            }
          }
        }

        const drawGrain = (t, alpha) => {
          if (!grain || alpha < 0.01) return
          const cover = Math.max(W / grain.width, H / grain.height)
          const frame = Math.floor(t * FPS)
          ctx.save()
          ctx.globalCompositeOperation = 'overlay'
          ctx.globalAlpha = alpha
          ctx.drawImage(grain, (hash(frame) - 0.5) * 8, (hash(frame + 2) - 0.5) * 8, grain.width * cover, grain.height * cover)
          ctx.restore()
        }

        const drawScan = (t, alpha) => {
          if (!scan || alpha < 0.01) return
          const cover = Math.max(W / scan.width, H / scan.height) * 1.05
          const oy = REDUCED ? 0 : (t * 36) % (scan.height * cover)
          ctx.save()
          ctx.globalCompositeOperation = 'screen'
          ctx.globalAlpha = alpha
          ctx.drawImage(scan, 0, oy - scan.height * cover, scan.width * cover, scan.height * cover)
          ctx.drawImage(scan, 0, oy, scan.width * cover, scan.height * cover)
          ctx.restore()
        }

        const drawType = (t) => {
          const frame = Math.floor(t * FPS)
          ctx.save()
          ctx.textBaseline = 'alphabetic'
          ctx.shadowColor = 'rgba(0,0,0,0.65)'
          ctx.shadowOffsetY = 1
          ctx.shadowBlur = 0
          for (const line of LINES) {
            const start = line.words[0].t - 0.05
            if (t < start || t > line.out + 0.8) continue
            const sizes = line.words.map((word) => sizeOf(word, t))
            const texts = line.words.map((word) => shownText(word, t))
            const widths = line.words.map((word, i) => {
              if (!texts[i]) return 0
              ctx.font = fontFor(word.role, sizes[i])
              ctx.letterSpacing = `${trackPx(word, sizes[i])}px`
              return ctx.measureText(texts[i]).width
            })
            const gap = 16
            const total = widths.reduce((sum, w) => sum + w, 0) + gap * Math.max(0, widths.filter((w) => w > 0).length - 1)
            let x = line.x
            if (line.align === 'center') x = line.x - total / 2
            if (line.align === 'right') x = line.x - total
            const decayK = line.decay ? smooth(line.out - (line.fade ?? 0.34), line.out, t) : 0
            line.words.forEach((word, i) => {
              const text = texts[i]
              const width = widths[i]
              if (!text) return
              const alpha = wordAlpha(word, line, t)
              if (alpha < 0.01) {
                x += width + gap
                return
              }
              const size = sizes[i]
              const jx = line.rain ? (hash(frame + i * 9) - 0.5) * 2 : 0
              ctx.font = fontFor(word.role, size)
              ctx.letterSpacing = `${trackPx(word, size)}px`
              ctx.filter = decayK > 0.04 ? `blur(${(decayK * 2.4).toFixed(2)}px)` : 'none'
              if (word.splitFor && t >= word.t && t < word.t + word.splitFor) {
                ctx.globalAlpha = alpha * 0.8
                ctx.fillStyle = MAGENTA
                ctx.fillText(text, x + jx + 5, line.y)
                ctx.fillStyle = FOG
                ctx.fillText(text, x + jx - 5, line.y)
              }
              if (decayK > 0.04) {
                ctx.globalAlpha = alpha * 0.35
                ctx.fillStyle = PAPER
                ctx.fillText(text, x + jx, line.y + 3 + decayK * 5)
              }
              ctx.globalAlpha = alpha * 0.93
              ctx.fillStyle = word.cyan ? FOG : PAPER
              ctx.fillText(text, x + jx, line.y)
              x += width + gap
            })
          }
          ctx.restore()
        }

        const weaveAt = (t) => {
          if (REDUCED) return { x: 0, y: 0 }
          return { x: Math.sin(t * 1.7) * 1.1, y: Math.sin(t * 1.15 + 2) * 0.8 }
        }

        const renderFrame = (t) => {
          ctx.setTransform(1, 0, 0, 1, 0, 0)
          ctx.filter = 'none'
          ctx.globalAlpha = 1
          ctx.globalCompositeOperation = 'source-over'
          ctx.fillStyle = HARBOR
          ctx.fillRect(0, 0, W, H)
          if (t < 0) return

          const weave = weaveAt(t)
          const maps = []
          let fog = 0
          let oxblood = 0
          let letterbox = 0
          let brighten = 0
          let clockMap = null

          for (const section of SECTIONS) {
            const alpha = sectionAlpha(section, t)
            if (alpha < 0.004) continue
            const map = drawPlate(plates[section.plate], section, t, alpha, weave)
            if (!map) continue
            maps.push(map)
            if (section.fog) fog = Math.max(fog, section.fog * alpha)
            if (section.oxblood) oxblood = Math.max(oxblood, alpha)
            if (section.letterbox) letterbox = Math.max(letterbox, alpha)
            if (section.clock && alpha > 0.4) clockMap = map
            if (section.brightenAt && t > section.brightenAt) brighten = smooth(section.brightenAt, section.brightenAt + 1.4, t) * alpha
          }
          if (t > 76 && t < 85) fog = Math.max(fog, smooth(76, 78, t) * (1 - smooth(83, 85, t)) * 0.2)
          if (t > 131 && t < 149) fog = Math.max(fog, 0.18)

          if (fog > 0.01) {
            ctx.save()
            ctx.globalCompositeOperation = 'soft-light'
            ctx.globalAlpha = fog
            ctx.fillStyle = FOG
            ctx.fillRect(0, 0, W, H)
            ctx.restore()
          }
          if (oxblood > 0.05) {
            const gradient = ctx.createLinearGradient(0, H * 0.62, 0, H)
            gradient.addColorStop(0, 'rgba(74,28,40,0)')
            gradient.addColorStop(1, `rgba(74,28,40,${0.55 * oxblood})`)
            ctx.fillStyle = gradient
            ctx.fillRect(0, H * 0.5, W, H * 0.5)
          }
          if (brighten > 0.02) {
            const gradient = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 420)
            gradient.addColorStop(0, `rgba(232,164,90,${0.18 * brighten})`)
            gradient.addColorStop(1, 'rgba(232,164,90,0)')
            ctx.globalCompositeOperation = 'screen'
            ctx.fillStyle = gradient
            ctx.fillRect(0, 0, W, H)
            ctx.globalCompositeOperation = 'source-over'
          }

          ctx.globalAlpha = 1
          for (const map of maps) drawFlare(map)
          if (clockMap) drawClock(clockMap, t)

          ctx.fillStyle = 'rgba(0,0,0,0.14)'
          ctx.fillRect(0, 0, W, H)

          drawType(t)
          drawGrain(t, t < 24.15 ? 0.38 : 0.32)
          drawScan(t, staticLevel(t))

          const edge = ctx.createLinearGradient(0, 0, W, 0)
          edge.addColorStop(0, 'rgba(126,200,198,0.16)')
          edge.addColorStop(0.08, 'rgba(126,200,198,0)')
          edge.addColorStop(0.92, 'rgba(196,91,138,0)')
          edge.addColorStop(1, 'rgba(196,91,138,0.16)')
          ctx.fillStyle = edge
          ctx.fillRect(0, 0, W, H)

          drawTear(t)

          if (INVERTS.some((hit) => Math.abs(t - hit) < 0.5 / FPS)) {
            ctx.save()
            ctx.globalCompositeOperation = 'difference'
            ctx.fillStyle = '#fff'
            ctx.globalAlpha = 0.92
            ctx.fillRect(0, 0, W, H)
            ctx.restore()
          }

          if (letterbox > 0.35) {
            const bar = (H - W / 2.35) / 2
            ctx.globalAlpha = 0.62 * letterbox
            ctx.fillStyle = HARBOR
            ctx.fillRect(0, 0, W, bar)
            ctx.fillRect(0, H - bar, W, bar)
            ctx.globalAlpha = 1
          }

          if (vignette && t < 207) ctx.drawImage(vignette, 0, 0)

          if (t > 206.2) {
            ctx.globalAlpha = smooth(206.2, 207.5, t)
            ctx.fillStyle = HARBOR
            ctx.fillRect(0, 0, W, H)
            ctx.globalAlpha = 1
            drawGrain(t, 0.45 * smooth(206.2, 207.5, t))
          }
        }

        const audio = new Audio()
        audio.preload = 'auto'
        audio.src = encodeURI(AUDIO)
        let audioOk = true
        audio.addEventListener('error', () => {
          audioOk = false
          warn('Audio failed to load.', audio.error)
        })

        const clock = { playing: false, started: false, position: START_AT, wall: 0, last: -1 }
        const now = () => performance.now() / 1000
        const currentTime = () => {
          if (!clock.playing) return clock.position
          if (audioOk && !audio.paused && !audio.ended) return audio.currentTime
          return clock.position + (now() - clock.wall)
        }

        let exporting = false

        const play = async () => {
          if (clock.position >= DURATION) clock.position = 0
          clock.playing = true
          clock.started = true
          clock.wall = now()
          if (gate) gate.hidden = true
          if (!audioOk) return
          try {
            audio.currentTime = clock.position
            await audio.play()
          } catch (error) {
            audioOk = false
            warn('Playback blocked, continuing silent.', error)
          }
        }

        const pause = () => {
          clock.position = currentTime()
          clock.playing = false
          audio.pause()
          if (gate && !exporting) gate.hidden = false
        }

        const seek = (delta) => {
          const target = clamp(currentTime() + delta, 0, DURATION)
          clock.position = target
          clock.wall = now()
          if (audioOk) audio.currentTime = Math.min(target, (audio.duration || target) - 0.05)
        }

        audio.addEventListener('ended', () => {
          clock.position = audio.duration || DURATION
          clock.wall = now()
        })

        const tick = () => {
          if (!clock.started) {
            requestAnimationFrame(tick)
            return
          }
          const t = currentTime()
          if (clock.playing && t >= DURATION) {
            clock.playing = false
            clock.position = DURATION
            if (gate) gate.hidden = false
          }
          const frame = Math.floor(t * FPS)
          if (frame !== clock.last) {
            clock.last = frame
            renderFrame(frame / FPS)
          }
          requestAnimationFrame(tick)
        }

        const handleKey = (event) => {
          if (exporting) return
          if (event.code === 'Space') {
            event.preventDefault()
            if (clock.playing) pause()
            else play()
          } else if (event.key === 'ArrowRight') seek(5)
          else if (event.key === 'ArrowLeft') seek(-5)
        }

        const api = {
          isReady: false,
          fps: FPS,
          duration: DURATION,
          width: W,
          height: H,
          renderFrame: (index) => {
            renderFrame(index / FPS)
            return true
          },
          capture: (index, quality = 0.92) => {
            renderFrame(index / FPS)
            return canvas.toDataURL('image/jpeg', quality)
          },
        }
        window.__STARSHIP = api
        window.__MOTION = api

        const boot = async () => {
          ctx.fillStyle = HARBOR
          ctx.fillRect(0, 0, W, H)
          await Promise.all([loadFonts(), loadAssets()])
          api.isReady = true
          log('Ready', { duration: DURATION, plates: Object.keys(plates).length })
          if (IS_EXPORT) return
          gate?.addEventListener('click', () => (clock.playing ? pause() : play()))
          window.addEventListener('keydown', handleKey)
          renderFrame(START_AT || 12)
          requestAnimationFrame(tick)
          if (window.MotionExport) {
            window.MotionExport.attachExportButton({
              canvas,
              fps: FPS,
              duration: DURATION,
              fileName: 'starship-rising-1080p24.mp4',
              audioUrl: encodeURI(AUDIO),
              bitrate: 16_000_000,
              renderFrame: (index) => renderFrame(index / FPS),
              onStart: () => {
                exporting = true
                if (clock.playing) pause()
                if (gate) gate.hidden = true
              },
              onFinish: () => {
                exporting = false
                if (gate) gate.hidden = clock.playing
                renderFrame(currentTime() || 12)
              },
            })
          }
        }

        boot().catch((error) => {
          console.error('[starship] Boot failed', error)
          api.bootError = String(error)
        })
      })()
    </script>
  </body>
</html>
